# Makes a GitHub release when a tag track-a-<n> or track-b-<n> is pushed.
# The title of the release is the message of the (annotated) tag.
name: release
on:
  push:
    tags: ["track-a-*", "track-b-*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          TITLE="$(git tag -l --format='%(contents:subject)' "$TAG")"
          [ -n "$TITLE" ] || TITLE="$TAG"
          case "$TAG" in
            track-a-*) FILES="track_a/recipe.py"; [ -f track_a/selection.csv ] && FILES="$FILES track_a/selection.csv" ;;
            track-b-*) FILES="submission/model.onnx submission/submission.json" ;;
          esac
          gh release create "$TAG" $FILES --title "$TITLE" --notes ""
