# Makes a release of Track A or Track B when you press "Run workflow"
# (Actions tab, "release"). Fill in the track, the number and the title.
name: release
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Track"
        type: choice
        options: [a, b]
        default: a
      number:
        description: "Release number (one more than the last of this track)"
        required: true
      title:
        description: "Title: what changed"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TRACK: ${{ inputs.track }}
          NUMBER: ${{ inputs.number }}
          TITLE: ${{ inputs.title }}
        run: |
          TAG="track-$TRACK-$NUMBER"
          if [ "$TRACK" = a ]; then
            FILES="track_a/recipe.py"
            [ -f track_a/selection.csv ] && FILES="$FILES track_a/selection.csv"
          else
            FILES="submission/model.onnx submission/submission.json"
          fi
          gh release create "$TAG" $FILES --target "$GITHUB_SHA" --title "$TITLE" --notes ""
